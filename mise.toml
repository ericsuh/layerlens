# Toolchain and task runner for layerlens.
# `mise install` provisions the pinned tools; `mise run build` produces
# bin/layerlens with the SPA embedded.

[tools]
go = "1.26"
node = "22"
golangci-lint = "2.13.2"

[env]
# The deploy target is linux/amd64 and the binary must stay statically linked
# so it can run under a hardened systemd unit with no libc dependency.
CGO_ENABLED = "0"

[tasks.deps]
description = "Install web dependencies"
dir = "{{config_root}}/web"
sources = ["package.json", "package-lock.json"]
outputs = ["node_modules/.package-lock.json"]
run = "npm install --no-audit --no-fund"

[tasks.build-web]
description = "Bundle the SPA (esbuild) and stylesheet (Tailwind v4 CLI) into internal/webui/dist"
depends = ["deps"]
dir = "{{config_root}}"
sources = ["web/src/**/*.ts", "web/src/**/*.tsx", "web/src/**/*.css", "web/index.html", "web/package.json"]
outputs = ["internal/webui/dist/app.js", "internal/webui/dist/app.css", "internal/webui/dist/index.html", "bin/esbuild-meta.json"]
run = [
  "mkdir -p internal/webui/dist bin",
  # Start from an empty dist so stale assets can never be embedded.
  "find internal/webui/dist -mindepth 1 ! -name .gitkeep -delete",
  # Tailwind v4 has no esbuild plugin path we want (DECISIONS §C5): the CLI is
  # its own step, not a bundler plugin.
  "web/node_modules/.bin/tailwindcss --input web/src/app.css --output internal/webui/dist/app.css --minify",
  "web/node_modules/.bin/esbuild web/src/main.tsx --bundle --minify --format=iife --target=es2022 --jsx=automatic --define:process.env.NODE_ENV=\\\"production\\\" --outfile=internal/webui/dist/app.js --metafile=bin/esbuild-meta.json",
  "cp web/index.html internal/webui/dist/index.html",
]

[tasks.build]
description = "Build bin/layerlens with the SPA embedded"
depends = ["build-web"]
dir = "{{config_root}}"
run = "go build -trimpath -o bin/layerlens ./cmd/layerlens"

[tasks.bundle-size]
description = "Report the bundled asset sizes from the esbuild metafile"
depends = ["build-web"]
dir = "{{config_root}}"
run = "node -e \"const m=require('./bin/esbuild-meta.json');for(const [f,o] of Object.entries(m.outputs))console.log((o.bytes/1024).toFixed(1).padStart(8),'KiB ',f)\""

[tasks.fmt]
description = "Format Go sources"
dir = "{{config_root}}"
run = "gofmt -l -w ./cmd ./internal"

[tasks.lint-go]
description = "Run golangci-lint (includes go vet)"
dir = "{{config_root}}"
# web/go.mod makes web/ a separate module, so ./... stops before the Go
# sources vendored inside web/node_modules.
run = "golangci-lint run ./..."

[tasks.lint-web]
description = "Run eslint over the SPA sources"
depends = ["deps"]
dir = "{{config_root}}/web"
run = "npm run --silent lint"

[tasks.lint]
description = "Lint both languages"
depends = ["lint-go", "lint-web"]
run = []

[tasks.typecheck]
description = "Typecheck the SPA (tsc --noEmit)"
depends = ["deps"]
dir = "{{config_root}}/web"
run = "npm run --silent typecheck"

[tasks.test-go]
description = "Run Go unit tests"
# The Go tests compile the go:embed'd internal/webui/dist. Without this
# dependency they race build-web, which deletes and rewrites that directory.
depends = ["build-web"]
dir = "{{config_root}}"
run = "go test ./..."

[tasks.test-web]
description = "Run Vitest unit tests"
# bundle.test.ts evaluates the real production bundle, so it must exist first.
depends = ["deps", "build-web"]
dir = "{{config_root}}/web"
run = "npm run --silent test"

[tasks.test]
description = "Run all unit tests"
depends = ["test-go", "test-web"]
run = []

[tasks.check]
description = "Everything CI-equivalent: lint, typecheck, tests, build"
depends = ["lint", "typecheck", "test", "build"]
run = []

[tasks.dev]
description = "Watch the SPA (esbuild + Tailwind) into .dev-dist and run the server against it"
depends = ["deps"]
dir = "{{config_root}}"
run = """
set -eu
# .dev-dist, deliberately NOT internal/webui/dist: that directory is a
# build-only artifact that go:embed compiles into the binary. Letting the dev
# watchers write it makes `mise run build` skip build-web (its declared outputs
# look fresh) and ship the unminified bundle plus a 1.8 MB source map, and
# races go:embed while the server binary is being compiled.
rm -rf .dev-dist
mkdir -p .dev-dist bin
cp web/index.html .dev-dist/index.html

tailwind_pid=""
esbuild_pid=""
server_pid=""
cleanup() {
  trap - EXIT INT TERM
  # Saved PIDs, not `kill 0`: this script runs in mise's own process group, so
  # `kill 0` signals the task runner itself and can leave watchers orphaned.
  for pid in "$tailwind_pid" "$esbuild_pid" "$server_pid"; do
    if [ -n "$pid" ]; then kill "$pid" 2>/dev/null || true; fi
  done
}
# Installed before anything is backgrounded, so a failure part-way through the
# launches still reaps whatever is already running.
trap cleanup EXIT INT TERM

# One synchronous pass first: --ui-dir now 404s a missing asset instead of
# serving the shell, so the first page load must not race the watchers.
web/node_modules/.bin/tailwindcss --input web/src/app.css --output .dev-dist/app.css

# `--watch=always` / `--watch=forever`: both CLIs stop watching when stdin is
# closed, which is exactly what a backgrounded job gets.
web/node_modules/.bin/tailwindcss --input web/src/app.css --output .dev-dist/app.css --watch=always &
tailwind_pid=$!
web/node_modules/.bin/esbuild web/src/main.tsx --bundle --sourcemap --format=iife --target=es2022 --jsx=automatic --outfile=.dev-dist/app.js --watch=forever &
esbuild_pid=$!

# Built and run directly rather than via `go run`: go run's compiled child is a
# grandchild of this script, so a signal delivered to the script alone leaves
# the server holding the port. Go changes need a restart either way.
go build -o bin/layerlens-dev ./cmd/layerlens
# --ui-dir makes the server read the watched assets from disk; the embedded
# copy inside the binary is a snapshot taken at compile time.
bin/layerlens-dev --listen "${LAYERLENS_LISTEN:-:8080}" --data-dir "${LAYERLENS_DATA_DIR:-.dev-data}" --ui-dir .dev-dist &
server_pid=$!
# `wait` is interruptible by the trap; a foreground command would not be.
wait "$server_pid"
"""
