version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - misspell
    - revive
  exclusions:
    presets:
      - std-error-handling
    rules:
      # httptest.ResponseRecorder results carry a NopCloser body; bodyclose
      # cannot see through the test helpers that do close them.
      - path: _test\.go
        linters:
          - errcheck
          - bodyclose

formatters:
  enable:
    - gofmt
